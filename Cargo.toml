[package]
name = "reclamo-anl"
version = "0.0.0"
edition = "2021"
rust-version = "1.75"
description = "Model-agnostic recursive language model harness (companion to CryptoJones/ReCLamO-Harness)."
license = "Apache-2.0"
repository = "https://github.com/CryptoJones/ReCLamO-Analysis"
readme = "README.md"

[[bin]]
name = "reclamo-anl"
path = "src/main.rs"

[lib]
name = "reclamo_anl"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
tempfile = "3"

[dev-dependencies]
pretty_assertions = "1"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
