[package]
name = "reclamo-anl"
version = "0.0.0"
edition = "2021"
rust-version = "1.75"
description = "Model-agnostic recursive language model harness (companion to CryptoJones/ReCLamO-Harness)."
license = "Apache-2.0"
repository = "https://github.com/CryptoJones/ReCLamO-Analysis"
readme = "README.md"

[[bin]]
name = "reclamo-anl"
path = "src/main.rs"

[lib]
name = "reclamo_anl"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
# `gzip` is needed because OpenRouter (and most production gateways) send
# `Content-Encoding: gzip` on responses above ~10 KB; without it reqwest's
# body reader returns "error decoding response body" (Kind::Decode) instead
# of the actual upstream JSON. Discovered on nemotron-3.5-lightning:free
# smoke (60 KB context) 2026-10-08.
#
# `http2` matters because with rustls + HTTP/1.1 only, the Cloudflare-
# fronted OpenRouter response for nemotron-3.5-lightning:free arrives as
# `HTTP/1.1 200 OK Transfer-Encoding: chunked` and the body starts with
# literal leading whitespace + 9-space padding lines
# (`b"\n         \n\n         \n..."`); the chunked decoder fails on those.
# The same request over HTTP/2 (which `curl -i` shows) works because
# HTTP/2 framing has no Transfer-Encoding: chunked and the body is just
# DATA frames. Verified 2026-10-08 by reading the first chunk of the
# response body through `Response::chunk()`.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
tempfile = "3"

[dev-dependencies]
pretty_assertions = "1"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
