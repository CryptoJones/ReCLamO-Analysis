# OpenRouter (https://openrouter.ai) via the OpenAI-compat endpoint.
#
# Run:
#   cargo run --example eval -- \
#     --provider openai-compat --model "$MODEL" --profile profiles/openrouter.toml \
#     --tasks Cerebex,MasterControl,Multivac,Neuromancer,SELMA \
#     --sizes small,medium --seeds 0,1 \
#     --out evals/results.openrouter.jsonl
#
# Key source: `pass openrouter/opencode` (first line, $10 cap on
# OpenRouter's side, ≈$0.001 used). Loaded at runtime via api_key_cmd
# so the key never touches the conversation, the log, or the JSONL
# rows. Do NOT use the openrouter/agent/* keys — those belong to the
# Buzz fleet lanes. If you need more than $10 of headroom, ask CJ
# rather than switching keys.
#
# Model examples (set $MODEL in the launching shell, or pass --model):
#   nvidia/nemotron-3-super-120b-a12b:free      — 262K ctx, reasoning
#   inclusionai/ling-3.1-flash:free             — 262K ctx
#   openai/gpt-oss-20b:free                     — 131K ctx (OpenAI open-weight)

name = "openrouter"
provider = "openai-compat"
model = "nvidia/nemotron-3-ultra-550b-a55b:free"
max_context = 1_048_576
# resident_kv is a *router budget*, not the model's real input cap.
# We use it to force harness-path on sizes the model would otherwise
# absorb via plain path. At 80_000:
#   small  (60K chars ≈ 17K tokens + 2K margin = 19K)  → plain
#   medium (300K chars ≈ 86K + 2K = 88K)              → harness
#   large  (1.2M chars ≈ 343K + 2K = 345K)            → harness
# 80K is the cross-tokenizer safety factor the peer recommended
# (0.7× of a 131K cap; here it's deliberately TIGHT so the harness
# path fires on medium and large even on 1M-ctx models like Gemini
# 2.5 Flash Lite).
resident_kv = 80_000
subcall_chars = 8_000
temperature = 0.7
top_p = 0.95

# Disable the model's native reasoning channel by default. The peer's
# 2026-10-08 #19 bench found that Nemotron and similar models spend
# most of the per-turn output budget on a reasoning preamble, then
# either hit `length` (plain path) or leave no room for a ```repl fence
# (harness path) — they end up emitting hallucinated tool_call JSON
# in `content` instead. Disabling reasoning gives the model the full
# 4K output to spend on content the harness can actually parse.
# Reasoning can be re-enabled per-profile (delete this field) for
# models that have shown it improves answers (e.g. Qwen 3 8B on Strata).
# Inline table form keeps it as a top-level field; a [extra_body] header
# would silently absorb base_url and api_key_cmd below.
extra_body = { reasoning = { enabled = false } }

# OpenAI-compat base.
base_url = "https://openrouter.ai/api/v1"

# Read the key at runtime. `pass` is GPG-locked, so this only runs when
# the eval actually fires; nothing enters the conversation, the log,
# or the row output. The sh -c wrapper lets us trim + pick the first
# line; `head -1` is the conservative read for a key entry.
api_key_cmd = "pass openrouter/opencode | head -1"

[loop_config]
max_iterations = 20
max_timeout_secs = 600
subcall_timeout_secs = 90
max_errors = 3
max_subcalls_per_run = 64
max_subcalls_per_exec = 24
root_max_output_tokens = 4096
subcall_max_output_tokens = 2048
route_by_size = true
plain_query_margin = 2_000
