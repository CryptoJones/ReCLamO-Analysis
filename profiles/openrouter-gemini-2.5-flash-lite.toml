# OpenRouter — google/gemini-2.5-flash-lite (1M ctx, $0.10/M)
#
# Run:
#   cargo run --release --example eval -- \
#     --provider openai-compat --model google/gemini-2.5-flash-lite --profile profiles/openrouter-gemini-2.5-flash-lite.toml \
#     --tasks Cerebex,MasterControl,Multivac,Neuromancer,SELMA \
#     --sizes small,medium --seeds 2,3 \
#     --mode both --out evals/results.<...>.jsonl
#
# Key source: `pass openrouter/opencode` (first line, $10 cap on
# OpenRouter's side). Loaded at runtime via api_key_cmd so the key
# never touches the conversation, the log, or the JSONL rows.

name = "openrouter-gemini-2.5-flash-lite"
provider = "openai-compat"
model = "google/gemini-2.5-flash-lite"
max_context = 1_048_576
# 80K router budget matches the Phase 7 Slice-B finding: forces
# harness path on medium so both paths are exercised, while small
# (60K chars / est 17K tokens) still takes plain.
resident_kv = 80_000
subcall_chars = 8_000
temperature = 0.7
top_p = 0.95

# Disable native reasoning — matches the Phase 7a/b profile.
extra_body = { reasoning = { enabled = false } }

# OpenAI-compat base.
base_url = "https://openrouter.ai/api/v1"

# Read the key at runtime. `pass` is GPG-locked; nothing enters the
# conversation, the log, or the row output.
api_key_cmd = "pass openrouter/opencode | head -1"

[loop_config]
max_iterations = 20
max_timeout_secs = 600
subcall_timeout_secs = 90
max_errors = 3
max_subcalls_per_run = 64
max_subcalls_per_exec = 24
root_max_output_tokens = 4096
subcall_max_output_tokens = 2048
route_by_size = true
plain_query_margin = 2_000
